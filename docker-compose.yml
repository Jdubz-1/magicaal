services:
  agent-builder:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: agent-builder
    volumes:
      - agents_dist:/agents-out

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '${API_PORT:-3000}:3000'
    env_file:
      - apps/api/.env
    environment:
      REDIS_URL: redis://redis:6379
      ENGINE_BASE_URL: http://engine:4000
      SEED_ON_BOOT: 'true'
      AGENTS_DIR: /agents
    volumes:
      - db_data:/data
      - agents_dist:/agents:ro
    depends_on:
      redis:
        condition: service_healthy
      agent-builder:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  engine:
    build:
      context: .
      dockerfile: apps/engine/Dockerfile
    ports:
      - '${ENGINE_PORT:-4000}:4000'
    env_file:
      - apps/engine/.env
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - db_data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '${WEB_PORT:-8080}:8080'
    env_file:
      - apps/web/.env
    depends_on:
      api:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  agents_dist:
