name: MagiCaal CodeQL config

# Paths excluded from analysis. These are not suppressions of real findings —
# they are code nobody wrote by hand, where an alert can neither be fixed at
# the source nor stay dismissed across a rebuild.
paths-ignore:
  # The committed Vite build of the Studio canvas. Regenerated by
  # `pnpm --filter @magicaal/web run build:canvas`; the sources it is built
  # from (apps/web/src/canvas/**) are analysed normally.
  - apps/web/public/canvas/**
  # TypeScript build output, gitignored but present in a working tree.
  - '**/dist/**'
  # Test code. Fixtures deliberately contain hostile-looking input, and a
  # finding in a test is not a finding in the product.
  - '**/*.test.ts'
  - '**/tests/**'
