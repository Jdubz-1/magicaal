name: RFC Interest Check
description: Gauge community interest before writing a full RFC
labels: ["rfc"]
body:
  - type: markdown
    attributes:
      value: |
        **The RFC itself is a pull request** — not an issue. RFCs are currently a self-serve design-note practice (no mandatory discussion window), so you're welcome to skip this and open the RFC PR directly.

        Use this issue if you'd rather briefly describe your idea and get early feedback before investing time in writing the full RFC document. Open a PR adding `rfcs/NNNN-short-title.md` using the template at [`rfcs/0000-template.md`](../rfcs/0000-template.md) whenever you're ready.

        See [`GOVERNANCE.md`](../GOVERNANCE.md) for the full RFC process and the list of changes that require an RFC.

  - type: textarea
    id: proposal
    attributes:
      label: What are you proposing?
      description: 1–3 sentences describing the change and the problem it solves.
      placeholder: "I'd like to propose..."
    validations:
      required: true

  - type: dropdown
    id: rfc_trigger
    attributes:
      label: Why does this need an RFC?
      description: Which RFC trigger applies? (See GOVERNANCE.md)
      options:
        - New node type or node category
        - AgentGraphDefinition schema change
        - NodeModule / ExecutionContext interface change (packages/sdk)
        - Public API shape change (/v1/ routes)
        - Marketplace package format change
        - New Engine subsystem
        - New external dependency in an npm-published package
        - Not sure — posting here to find out
    validations:
      required: true
