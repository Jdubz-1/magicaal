name: Feature Request
description: Suggest a new feature or enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting: check [open issues](https://github.com/magicaal/magicaal/issues) and [GitHub Discussions](https://github.com/magicaal/magicaal/discussions) to see if this has already been proposed.

        **Note:** Significant changes to the public API (`/v1/`), `AgentGraphDefinition` schema, `NodeModule` interface, or Marketplace package format require an RFC. See [GOVERNANCE.md](../GOVERNANCE.md) for the RFC process.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who is affected and how?
      placeholder: "As a platform engineer, I need to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider and why do you prefer this one?
    validations:
      required: false

  - type: dropdown
    id: phase
    attributes:
      label: Roadmap Fit
      description: Which phase of the roadmap does this best fit? (See ROADMAP.md)
      options:
        - Phase 5 — Integrations & Marketplace
        - Phase 6 — Workspace, Coding Environment & Token Compression
        - Phase 7 — Scale, Ecosystem & SDK Framework Bindings
        - Phase 8 — Model Gateway, FinOps & Cost Governance
        - No preference / not sure
    validations:
      required: false
