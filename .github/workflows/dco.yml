name: DCO

# Commit-message gates.
#
# check-sign-off: CONTRIBUTING.md requires every commit to carry a
#   Signed-off-by trailer and tells contributors a bot checks it. This is that
#   check — implemented in-repo rather than as an installed GitHub App so it
#   needs no org-level setup.
#
# check-attribution: CLAUDE.md forbids AI attribution in commit messages
#   absolutely. .githooks/commit-msg enforces that locally, but --no-verify
#   bypasses it and the hook only exists on machines that installed it. This
#   job closes both gaps by running that same hook server-side, so the patterns
#   have exactly one definition.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, DEV-main]

jobs:
  check-sign-off:
    name: Check Signed-off-by trailers
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit alone is not enough — every commit in the PR is
          # checked, so the full range must be present.
          fetch-depth: 0

      - name: Verify every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue

            author="$(git show -s --format='%an <%ae>' "$sha")"
            subject="$(git show -s --format='%s' "$sha")"

            # Merge commits are generated by GitHub and carry no trailer.
            if [ "$(git rev-list --parents -n 1 "$sha" | wc -w)" -gt 2 ]; then
              echo "skip (merge)  ${sha:0:8}  $subject"
              continue
            fi

            if git show -s --format='%B' "$sha" | grep -qiE "^Signed-off-by: .+ <.+@.+>$"; then
              echo "ok            ${sha:0:8}  $subject"
            else
              echo "MISSING       ${sha:0:8}  $subject  ($author)"
              missing=$((missing + 1))
            fi
          done < <(git rev-list "$BASE_SHA".."$HEAD_SHA")

          if [ "$missing" -gt 0 ]; then
            echo ""
            echo "$missing commit(s) are missing a Signed-off-by trailer."
            echo "Amend with:  git commit --amend -s   (then force-push)"
            echo "For several commits:  git rebase --signoff $BASE_SHA"
            echo "See CONTRIBUTING.md for the DCO requirement."
            exit 1
          fi

  check-attribution:
    name: Check for AI attribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "pull_request" ]; then
            echo "range=${PR_BASE}..${PR_HEAD}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # On push, `before` is unusable for a new branch (all zeros) or after
          # a force-push (points at a commit that no longer exists here), so
          # fall back to just the tip rather than failing the job.
          if git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            echo "range=${PUSH_BEFORE}..${PUSH_AFTER}" >> "$GITHUB_OUTPUT"
          else
            echo "range=${PUSH_AFTER}~1..${PUSH_AFTER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan commit messages with the repository's own commit-msg hook
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -euo pipefail

          test -x .githooks/commit-msg || {
            echo "::error::.githooks/commit-msg is missing or not executable"
            exit 1
          }

          tmp="$(mktemp)"
          failed=0
          checked=0

          while read -r sha; do
            [ -z "$sha" ] && continue
            subject="$(git show -s --format='%s' "$sha")"

            # Merge commits are generated by GitHub; their messages are not
            # authored by a contributor.
            if [ "$(git rev-list --parents -n 1 "$sha" | wc -w)" -gt 2 ]; then
              echo "skip (merge)  ${sha:0:8}  $subject"
              continue
            fi

            checked=$((checked + 1))
            git show -s --format='%B' "$sha" > "$tmp"

            if output="$(./.githooks/commit-msg "$tmp" 2>&1)"; then
              echo "ok            ${sha:0:8}  $subject"
            else
              echo "ATTRIBUTION   ${sha:0:8}  $subject"
              echo "$output" | sed 's/^/                /'
              echo "::error::Commit ${sha:0:8} carries AI attribution in its message"
              failed=$((failed + 1))
            fi
          done < <(git rev-list "$RANGE")

          echo ""
          echo "checked $checked commit(s) in $RANGE"

          if [ "$failed" -gt 0 ]; then
            echo ""
            echo "$failed commit(s) carry AI attribution. CLAUDE.md forbids this"
            echo "under any circumstance. Rewrite the offending messages:"
            echo ""
            echo "  git rebase -i <base>   # reword each one"
            echo ""
            echo "Install the local hook so this is caught before you push:"
            echo "  pnpm run hooks:install"
            exit 1
          fi
