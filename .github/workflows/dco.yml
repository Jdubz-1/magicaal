name: DCO

# CONTRIBUTING.md requires every commit to carry a Signed-off-by trailer, and
# tells contributors a bot checks it. This is that check — implemented in-repo
# rather than as an installed GitHub App so it needs no org-level setup.
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-sign-off:
    name: Check Signed-off-by trailers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit alone is not enough — every commit in the PR is
          # checked, so the full range must be present.
          fetch-depth: 0

      - name: Verify every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue

            author="$(git show -s --format='%an <%ae>' "$sha")"
            subject="$(git show -s --format='%s' "$sha")"

            # Merge commits are generated by GitHub and carry no trailer.
            if [ "$(git rev-list --parents -n 1 "$sha" | wc -w)" -gt 2 ]; then
              echo "skip (merge)  ${sha:0:8}  $subject"
              continue
            fi

            if git show -s --format='%B' "$sha" | grep -qiE "^Signed-off-by: .+ <.+@.+>$"; then
              echo "ok            ${sha:0:8}  $subject"
            else
              echo "MISSING       ${sha:0:8}  $subject  ($author)"
              missing=$((missing + 1))
            fi
          done < <(git rev-list "$BASE_SHA".."$HEAD_SHA")

          if [ "$missing" -gt 0 ]; then
            echo ""
            echo "$missing commit(s) are missing a Signed-off-by trailer."
            echo "Amend with:  git commit --amend -s   (then force-push)"
            echo "For several commits:  git rebase --signoff $BASE_SHA"
            echo "See CONTRIBUTING.md for the DCO requirement."
            exit 1
          fi
