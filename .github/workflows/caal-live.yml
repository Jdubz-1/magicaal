name: Caal live smoke

# Opt-in only. This calls a real provider and spends credit, so it never runs
# on a pull request. The same corpus runs against a scripted model on every CI
# run (apps/engine/tests/caal) — this tier exists to catch provider-side drift
# a fake cannot see: a model deprecation, a tightened tool-schema check, a
# latency regression.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Base URL of a running MagiCaal API'
        required: true

jobs:
  live-smoke:
    name: Caal live smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the Caal corpus against a live provider
        env:
          CAAL_LIVE: '1'
          CAAL_API_URL: ${{ github.event.inputs.api_url }}
          CAAL_TOKEN: ${{ secrets.CAAL_LIVE_TOKEN }}
        run: pnpm caal:live

      - name: Upload the recorded baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caal-live-baseline
          path: tests/caal-live/baseline.json
