name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  docker:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
          - app: engine
            dockerfile: apps/engine/Dockerfile
          - app: web
            dockerfile: apps/web/Dockerfile

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Login to GitHub Container Registry (primary)
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Login to Docker Hub (mirror)
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag as :latest only for non-prerelease tags (no hyphen in tag name)
      - name: Compute image tags
        id: tags
        run: |
          VERSION="${{ github.ref_name }}"
          GHCR="ghcr.io/magicaal/${{ matrix.app }}"
          HUB="magicaal/${{ matrix.app }}"
          TAGS="${GHCR}:${VERSION},${HUB}:${VERSION}"
          if [[ "$VERSION" != *"-"* ]]; then
            TAGS="${TAGS},${GHCR}:latest,${HUB}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}

  npm-publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install Devbox
        uses: jetify-com/devbox-install-action@v0.11.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: devbox run -- pnpm install --frozen-lockfile

      # Dependency order matters: compiler imports ALL_NODES from nodes at
      # runtime, and cli imports compiler.
      - name: Build packages
        run: devbox run -- pnpm --filter @magicaal/core --filter @magicaal/sdk-node --filter @magicaal/nodes --filter @magicaal/sdk --filter @magicaal/compiler --filter @magicaal/cli run build

      # Published in dependency order so each package's deps already exist on
      # the registry. core and sdk-node ship zero runtime code but are
      # referenced by the emitted declarations of nodes and compiler.
      - name: Publish @magicaal/core
        run: devbox run -- pnpm --filter @magicaal/core publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @magicaal/sdk-node
        run: devbox run -- pnpm --filter @magicaal/sdk-node publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @magicaal/nodes
        run: devbox run -- pnpm --filter @magicaal/nodes publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @magicaal/sdk
        run: devbox run -- pnpm --filter @magicaal/sdk publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @magicaal/compiler
        run: devbox run -- pnpm --filter @magicaal/compiler publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @magicaal/cli
        run: devbox run -- pnpm --filter @magicaal/cli publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: npm-publish
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # Extract the CHANGELOG section for this tag to use as the release body
      - name: Extract release notes
        id: release-notes
        run: |
          VERSION="${{ github.ref_name }}"
          # Strip leading 'v' if present for CHANGELOG lookup
          VERSION_CLEAN="${VERSION#v}"
          # Extract lines between this version's header and the next
          NOTES=$(awk "/^## \[${VERSION_CLEAN}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          # Write to a temp file to avoid quoting issues
          echo "$NOTES" > /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: /tmp/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
