name: CI

on:
  pull_request:
    branches: [main, DEV-main]
  push:
    branches: [main, DEV-main]

jobs:
  lint-typecheck-test:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Recursive rather than a per-app matrix: `pnpm -r run <script>` skips
      # workspaces that don't declare the script, so new packages are covered
      # the moment they add one. The previous api/engine matrix left 339 tests
      # across nodes, the 15 integration packages, cli, sdk-client, and web
      # outside CI entirely.
      - name: Lint
        run: pnpm -r run lint

      - name: Type-check
        run: pnpm -r run type-check

      - name: Test
        run: pnpm -r run test

      # Coverage gates: apps/api at 80%, apps/engine on a ratchet just under
      # its current floor (see apps/engine/jest.config.ts).
      - name: Coverage (api)
        run: pnpm --filter @magicaal/api run test:cov

      - name: Coverage (engine)
        run: pnpm --filter @magicaal/engine run test:cov

  build-packages:
    name: Build and verify packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check packages/core
        run: pnpm --filter @magicaal/core run type-check

      - name: Type-check packages/sdk-node
        run: pnpm --filter @magicaal/sdk-node run type-check

      - name: Build sdk-client (dual ESM/CJS)
        run: pnpm --filter @magicaal/sdk run build

      - name: Verify CJS build is importable
        run: node -e "require('./packages/sdk-client/dist/cjs/index.js'); console.log('CJS OK')"

      - name: Verify ESM build is importable
        run: node --input-type=module -e "import './packages/sdk-client/dist/esm/index.js'; console.log('ESM OK')" < /dev/null

      - name: Verify TypeScript declarations exist
        run: test -f packages/sdk-client/dist/types/index.d.ts && echo "Declarations OK"

      - name: Build packages/integrations/caal
        run: pnpm --filter @magicaal/integration-caal run build

  docker-build:
    name: Docker build (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: [lint-typecheck-test, build-packages]
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
          - app: engine
            dockerfile: apps/engine/Dockerfile
          - app: web
            dockerfile: apps/web/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image (${{ matrix.app }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
