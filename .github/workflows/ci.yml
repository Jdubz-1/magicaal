name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-typecheck-test:
    name: Lint, type-check, and test (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            filter: '@magicaal/api'
          - app: engine
            filter: '@magicaal/engine'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter ${{ matrix.filter }} run lint

      - name: Type-check
        run: pnpm --filter ${{ matrix.filter }} run type-check

      - name: Test
        run: pnpm --filter ${{ matrix.filter }} run test

  build-packages:
    name: Build and verify packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check packages/core
        run: pnpm --filter @magicaal/core run type-check

      - name: Type-check packages/sdk-node
        run: pnpm --filter @magicaal/sdk-node run type-check

      - name: Build sdk-client (dual ESM/CJS)
        run: pnpm --filter @magicaal/sdk-client run build

      - name: Verify CJS build is importable
        run: node -e "require('./packages/sdk-client/dist/cjs/index.js'); console.log('CJS OK')"

      - name: Verify ESM build is importable
        run: node --input-type=module -e "import './packages/sdk-client/dist/esm/index.js'; console.log('ESM OK')" < /dev/null

      - name: Verify TypeScript declarations exist
        run: test -f packages/sdk-client/dist/types/index.d.ts && echo "Declarations OK"

      - name: Build packages/integrations/caal
        run: pnpm --filter @magicaal/integration-caal run build

  docker-build:
    name: Docker build (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: [lint-typecheck-test, build-packages]
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
          - app: engine
            dockerfile: apps/engine/Dockerfile
          - app: web
            dockerfile: apps/web/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build Docker image (${{ matrix.app }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
